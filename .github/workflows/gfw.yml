name: GFW Data Pipeline

on:
  workflow_dispatch: # This lets you run it manually with a button
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run GFW Fetch Script
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
          # Optional overrides — see `python scripts/gfw_fetch.py --help`:
          # GFW_REGION_ID, GFW_REGION_DATASET, GFW_START, GFW_END, GFW_GEAR,
          # GFW_GROUP_BY, GFW_SPATIAL_RESOLUTION, GFW_TEMPORAL_RESOLUTION,
          # GFW_FORMAT, GFW_DATASET
        run: python scripts/gfw_fetch.py

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: gfw-fishing-effort-report
          path: data/raw/gfw/
          if-no-files-found: error
